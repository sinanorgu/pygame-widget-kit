[pytest]
# Pytest konfigürasyonu

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    unit: Unit tests için widget'lar (fast)
    integration: Integration tests birden fazla component için
    visual: Visual regression tests
    slow: Uzun süren testler
    ci: CI/CD pipeline'da çalışacak testler

# Coverage
# pytest ile: pytest --cov=src/pygame_widget_kit --cov-report=html
